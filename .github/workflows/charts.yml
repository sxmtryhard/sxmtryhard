name: Charts and cards

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/skills.json"
      - "assets/areas.json"
      - "assets/projects.json"
      - "scripts/radar.py"
      - "scripts/cards.py"
      - ".github/workflows/charts.yml"

permissions:
  contents: write

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Hand-authored radars (edit the JSON files to change them)
      - name: Stack radar
        run: python scripts/radar.py --data assets/skills.json -o assets/radar --values

      - name: Areas radar
        run: python scripts/radar.py --data assets/areas.json -o assets/radar-areas --values

      # Self-hosted stats, languages and repo cards. Without a METRICS_TOKEN
      # secret (a PAT) the built-in token is used and the contribution/streak
      # tiles are skipped.
      - name: Stat, language and repo cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cards.py \
            --user "${{ github.repository_owner }}" \
            --projects assets/projects.json \
            --out assets

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/radar*.svg assets/card-*.svg
          git diff --staged --quiet || git commit -m "chore: refresh charts and cards"
          git push
